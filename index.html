<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Internet Radio</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #111;
            font-family: Arial, sans-serif;
            color: white;
        }

        .radio {
            width: 90%;
            max-width: 500px;
            padding: 45px 35px;
            text-align: center;
            background: #1e1e1e;
            border-radius: 20px;
            box-shadow: 0 15px 50px rgba(0,0,0,.5);
        }

        h1 {
            margin: 0;
            font-size: 32px;
        }

        .station {
            margin-top: 10px;
            color: #aaa;
            font-size: 16px;
        }

        .status {
            margin: 25px 0;
            color: #aaa;
        }

        button {
            width: 90px;
            height: 90px;
            border: none;
            border-radius: 50%;
            background: white;
            color: #111;
            font-size: 30px;
            cursor: pointer;
        }

        button:hover {
            transform: scale(1.06);
        }

        .volume {
            margin-top: 30px;
        }

        input {
            width: 100%;
        }

        .volume-text {
            margin-top: 8px;
            color: #888;
            font-size: 13px;
        }
    </style>
</head>

<body>

<div class="radio">

    <h1>📻 Internet Radio</h1>

    <div class="station">
        BBC World Service
    </div>

    <div class="status" id="status">
        Радио выключено
    </div>

    <button id="playButton">
        ▶
    </button>

    <div class="volume">
        <input
            id="volume"
            type="range"
            min="0"
            max="1"
            step="0.01"
            value="0.8"
        >

        <div class="volume-text">
            Громкость
        </div>
    </div>

</div>

<audio id="radio" preload="none">
    <source
        src="https://stream.live.vc.bbcmedia.co.uk/bbc_world_service"
        type="audio/mpeg"
    >
</audio>

<script>

const radio = document.getElementById("radio");
const button = document.getElementById("playButton");
const status = document.getElementById("status");
const volume = document.getElementById("volume");

radio.volume = 0.8;

button.addEventListener("click", async () => {

    if (radio.paused) {

        status.textContent = "Подключение...";

        try {
            await radio.play();

            button.textContent = "⏸";
            status.textContent = "🔴 Радио играет";

        } catch (error) {

            console.error(error);

            status.textContent =
                "⚠ Не удалось подключиться к радио";
        }

    } else {

        radio.pause();

        button.textContent = "▶";
        status.textContent = "Радио выключено";
    }
});

volume.addEventListener("input", () => {
    radio.volume = volume.value;
});

radio.addEventListener("waiting", () => {
    status.textContent = "⏳ Буферизация...";
});

radio.addEventListener("playing", () => {
    button.textContent = "⏸";
    status.textContent = "🔴 Радио играет";
});

radio.addEventListener("pause", () => {
    button.textContent = "▶";
});

radio.addEventListener("error", () => {
    status.textContent =
        "⚠ Ошибка подключения к радиопотоку";
});

</script>

</body>
</html>
