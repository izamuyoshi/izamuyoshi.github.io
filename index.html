<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Моё радио</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #111;
            font-family: Arial, sans-serif;
            color: white;
        }

        .radio {
            width: 90%;
            max-width: 500px;
            padding: 40px;
            text-align: center;
            background: #1d1d1d;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
        }

        h1 {
            margin: 0 0 10px;
            font-size: 32px;
        }

        .status {
            color: #aaa;
            margin-bottom: 30px;
        }

        button {
            width: 90px;
            height: 90px;
            border: none;
            border-radius: 50%;
            background: white;
            color: #111;
            font-size: 32px;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            transform: scale(1.08);
        }

        button:active {
            transform: scale(0.95);
        }

        .volume {
            width: 100%;
            margin-top: 30px;
        }

        input[type="range"] {
            width: 100%;
        }

        .volume-text {
            color: #aaa;
            font-size: 14px;
            margin-top: 10px;
        }
    </style>
</head>

<body>

<div class="radio">

    <h1>📻 Моё радио</h1>

    <div class="status" id="status">
        Радио выключено
    </div>

    <button id="playButton" onclick="toggleRadio()">
        ▶
    </button>

    <div class="volume">
        <input
            type="range"
            id="volume"
            min="0"
            max="1"
            step="0.01"
            value="0.8"
        >

        <div class="volume-text">
            Громкость
        </div>
    </div>

</div>

<audio id="radio" preload="none">
    <source
        src="YOUR_RADIO_STREAM_URL"
        type="audio/mpeg"
    >
</audio>

<script>

    const radio = document.getElementById("radio");
    const button = document.getElementById("playButton");
    const status = document.getElementById("status");
    const volume = document.getElementById("volume");

    radio.volume = 0.8;

    volume.addEventListener("input", function () {
        radio.volume = this.value;
    });

    function toggleRadio() {

        if (radio.paused) {

            radio.play()
                .then(() => {
                    button.textContent = "⏸";
                    status.textContent = "🔴 Радио играет";
                })
                .catch(() => {
                    status.textContent = "Не удалось запустить радио";
                });

        } else {

            radio.pause();

            button.textContent = "▶";
            status.textContent = "Радио выключено";
        }
    }

    radio.addEventListener("waiting", function () {
        status.textContent = "⏳ Подключение...";
    });

    radio.addEventListener("playing", function () {
        status.textContent = "🔴 Радио играет";
    });

    radio.addEventListener("error", function () {
        status.textContent = "⚠ Ошибка подключения к радиостанции";
    });

</script>

</body>
</html>
